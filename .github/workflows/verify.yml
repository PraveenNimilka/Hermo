name: Verify Hermo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm run check:repo
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm test
      - run: npm run test:consumers
      # External sites are deliberately excluded from automatic CI traffic.
